name: Build AFRICA ATONA Android beta
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build development APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Package and checksum
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/africa-atona.apk
          cd artifacts
          sha256sum africa-atona.apk > africa-atona.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: africa-atona-android-beta
          path: artifacts/*
      - name: Publish versioned development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "atona-beta-${GITHUB_RUN_NUMBER}" artifacts/* --prerelease --title "AFRICA ATONA Android beta ${GITHUB_RUN_NUMBER}" --notes "Development APK. Foreground web navigation client; requires africaatona.africandroid.world. Not a Play Store production release."
